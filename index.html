<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جست‌وجو در فایل‌های CSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f7f4ec; --ink:#1c1a16; --muted:#7a7466; --line:#d9d3c4; --mark:#ffe58a; --file:#24504a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink);
    font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; font-size:16px; line-height:1.8; }
  main { max-width:860px; margin:0 auto; padding:48px 20px 96px; }
  h1 { font-size:20px; font-weight:500; margin:0 0 20px; color:var(--muted); }
  form { display:flex; border-bottom:2px solid var(--ink); }
  input { flex:1; border:0; background:transparent; font:inherit; font-size:26px; padding:10px 0; outline:none; color:var(--ink); }
  input::placeholder { color:var(--line); }
  input:focus-visible { box-shadow:0 3px 0 0 var(--file); }
  .stat { margin:14px 0 36px; color:var(--muted); font-size:14px; min-height:1.8em; }
  section { margin-bottom:40px; }
  .file { font-weight:700; color:var(--file); font-size:18px; margin:0 0 4px; display:flex; gap:12px; align-items:baseline; }
  .file small { font-weight:400; color:var(--muted); font-size:13px; }
  .header { font-family:ui-monospace, Menlo, monospace; direction:ltr; text-align:right; font-size:12px; color:var(--muted); margin:0 0 8px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; border-right:3px solid var(--line); padding:2px 14px 2px 0; }
  pre + pre { margin-top:6px; }
  pre span.n { color:var(--muted); font-size:12px; margin-left:10px; user-select:none; }
  mark { background:var(--mark); color:inherit; padding:0 1px; }
</style>
</head>
<body>
<main>
  <h1>جست‌وجو در فایل‌های CSV</h1>
  <form id="f"><input id="q" autofocus autocomplete="off" placeholder="نام، نقش، زمان…"></form>
  <div class="stat" id="stat">در حال بارگذاری…</div>
  <div id="out"></div>
</main>
<script>
const q = document.getElementById("q"), out = document.getElementById("out"), stat = document.getElementById("stat");
const fa = n => n.toLocaleString("fa-IR");
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// Persian-aware normalization: ي/ی, ك/ک, strip ZWNJ/tatweel, fold Arabic-Indic digits.
// Length-preserving where possible so highlight offsets stay aligned.
const normChar = s => s
  .replace(/[\u064A\u0649]/g, "\u06CC")
  .replace(/\u0643/g, "\u06A9")
  .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
  .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
  .toLowerCase();
const norm = s => normChar(s).replace(/[\u0640\u200C\u200F\u200E]/g, "");

let index = null;
fetch("index.json?" + Date.now()).then(r => r.json()).then(d => {
  index = d.files.map(f => ({ ...f, n: f.rows.map(norm) }));
  run(true);
}).catch(() => { stat.textContent = "index.json پیدا نشد — اول build-index.js را اجرا کنید."; });

function hl(raw, term) {
  const n = normChar(raw), t = normChar(term);
  let i = 0, res = "", pos;
  while ((pos = n.indexOf(t, i)) !== -1) {
    res += esc(raw.slice(i, pos)) + "<mark>" + esc(raw.slice(pos, pos + t.length)) + "</mark>";
    i = pos + t.length;
  }
  return res + esc(raw.slice(i));
}

let timer, last = null;
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); run(); });
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 120); });

function run(force) {
  if (!index) return;
  const term = q.value.trim();
  if (!force && term === last) return; last = term;
  if (!term) {
    stat.textContent = fa(index.length) + " فایل، " + fa(index.reduce((a, f) => a + f.rows.length, 0)) + " ردیف";
    out.innerHTML = ""; return;
  }
  const t = norm(term);
  const results = [];
  for (const f of index) {
    const hits = [];
    f.n.forEach((line, i) => { if (line.includes(t)) hits.push({ n: i + 2, raw: f.rows[i] }); });
    if (hits.length) results.push({ file: f.file, header: f.header, hits });
  }
  const total = results.reduce((a, f) => a + f.hits.length, 0);
  stat.textContent = total ? fa(total) + " نتیجه در " + fa(results.length) + " فایل" : "چیزی پیدا نشد";
  out.innerHTML = results.map(f => `
    <section>
      <p class="file">${esc(f.file)} <small>${fa(f.hits.length)} مورد</small></p>
      <p class="header">${esc(f.header)}</p>
      ${f.hits.map(h => `<pre><span class="n">${fa(h.n)}</span>${hl(h.raw, term)}</pre>`).join("")}
    </section>`).join("");
}
</script>
</body>
</html>
